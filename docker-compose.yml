services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  banking-ai:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment:
      APP_NAME: Banking AI
      APP_VERSION: 0.1.0

      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2

      DATABASE_URL: postgresql+psycopg://banking:banking@host.docker.internal:5432/banking

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data: